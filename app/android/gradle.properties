org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin incremental compilation is disabled: on some Windows hosts the compiler
# cannot close its memory-mapped cache files and every release build dies with
# "Could not close incremental caches in ...\caches-jvm\jvm\kotlin". This project
# has a handful of Kotlin files (MainActivity + the home-screen widget), so a full
# recompile each build costs seconds and buys a deterministic build everywhere.
kotlin.incremental=false
