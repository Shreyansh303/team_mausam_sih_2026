<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Mausam Personalized - persona-aware weather home screen (Team Mausam prototype, SIH 2026).">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Mausam Personalized">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Mausam Personalized</title>
  <meta name="theme-color" content="#1565C0">
  <link rel="manifest" href="manifest.json">

  <!-- Boot splash (docs/07 §B2 "app icon/splash"). Flutter web paints nothing until the engine
       has loaded, so the page shows the app mark on IMD blue until the first frame arrives.
       `flutter-first-frame` is fired by the engine itself - no Dart code has to remove this. -->
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #1565C0; }
    #boot {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: #1565C0; transition: opacity .35s ease; z-index: 9999;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    #boot img { width: 104px; height: 104px; }
    #boot p { color: #E3F2FD; font-size: 14px; margin: 0; letter-spacing: .2px; }
    #boot.done { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="boot">
    <img src="icons/Icon-192.png" alt="Mausam Personalized">
    <p>Mausam Personalized</p>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (!boot) return;
      boot.classList.add('done');
      window.setTimeout(function () { boot.remove(); }, 400);
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
