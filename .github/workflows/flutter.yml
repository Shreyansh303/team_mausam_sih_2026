name: flutter

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/flutter.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/flutter.yml"
  workflow_dispatch:

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned to the toolchain the app was built with (app/pubspec.yaml, docs/PROGRESS.md → H0).
  FLUTTER_VERSION: "3.47.2"

jobs:
  apk:
    name: analyze · test · release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      # The suite is offline: docs/fixtures/*.json are parsed from disk, map tiles come from a
      # stub tile provider and the alerts socket is faked (app/test/support.dart).
      - name: Test
        run: flutter test

      # `app/android/app/build.gradle.kts` pins compileSdk = 37 (permission_handler_android
      # 14.1.0 requires it); AGP installs the platform on demand.
      - name: Build release APK (debug signing)
        run: flutter build apk --release

      - name: APK size
        run: ls -lh build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

  web:
    name: web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        run: flutter build web

      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: app/build/web
          if-no-files-found: error
          retention-days: 7
